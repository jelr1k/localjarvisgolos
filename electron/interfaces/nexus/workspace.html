<section class="page nx-workspace">

      <svg class="nx-links" viewBox="0 0 2400 1500" preserveAspectRatio="none">

        <line data-a="files" data-b="aliases"></line><line data-a="files" data-b="tools"></line><line data-a="model" data-b="stats"></line><line data-a="voice" data-b="wake"></line>
      </svg>
      <button class="nx-node" data-node-id="core" data-state="core" style="left:950px;top:500px"><div class="nx-node-top"><strong>WORKSPACE CORE</strong><em>CORE</em></div><small>Центр пространства и точка связи остальных возможностей.</small></button>
      <button class="nx-node" data-node-id="voice" style="left:620px;top:300px"><div class="nx-node-top"><strong>VOICE</strong><em>01</em></div><small>Голосовой контур, запись и распознавание.</small></button>
