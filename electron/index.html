<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JARVIS</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark">J</span>
        <div><strong>JARVIS</strong><small>локальный ассистент</small></div>
      </div>
      <nav class="nav">
        <button class="nav-item active" data-page="home"><span>◉</span>Главная</button>
        <button class="nav-item" data-page="chat"><span>◌</span>Чат</button>
        <button class="nav-item" data-page="commands"><span>⌘</span>Команды</button>
        <button class="nav-item" data-page="workspace"><span>▣</span>Рабочая область</button>
        <button class="nav-item" data-page="ai"><span>◇</span>ИИ</button>
        <button class="nav-item" data-page="settings"><span>⚙</span>Настройки</button>
      </nav>
      <div class="sidebar-bottom">
        <div class="status"><i></i><span>Система готова</span></div>
        <div class="profile"><b>Джелрик</b><small>локальный режим</small></div>
      </div>
    </aside>
    <main class="main">
      <header class="topbar">
        <div><span class="eyebrow">JARVIS</span><span class="crumb">/ <span id="pageName">Главная</span></span></div>
        <div class="top-status">● онлайн</div>
      </header>
      <main id="pageContainer"></main>
    </main>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
