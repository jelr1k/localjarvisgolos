name: JARVIS updater release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 0.1.3"
        required: true
        default: "0.1.3"
      tag:
        description: "Release tag, for example v0.1.3"
        required: true
        default: "v0.1.3"
  push:
    branches:
      - 'release/v*'

permissions:
  contents: read

jobs:
  test:
    name: Test the exact release sources
    runs-on: windows-latest
    outputs:
      version: ${{ steps.release_meta.outputs.version }}
      tag: ${{ steps.release_meta.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: config/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r config/requirements.txt

      - name: Syntax check
        run: python -m compileall -q core chat llm services security tools voice presentation ui start

      - name: Run complete test suite
        run: >-
          python -m pytest -q
          --cov=chat --cov=core --cov=llm --cov=services
          --cov=security --cov=tools --cov=voice --cov=presentation
          --cov=start --cov-report=term-missing

      - name: Resolve and validate release version
        id: release_meta
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          python - <<'PY'
          import os
          import re
          import sys

          event_name = os.environ.get("GITHUB_EVENT_NAME", "")
          if event_name == "workflow_dispatch":
              version = os.environ.get("INPUT_VERSION", "").strip()
              tag = os.environ.get("INPUT_TAG", "").strip()
          elif event_name == "push":
              ref_name = os.environ.get("GITHUB_REF_NAME", "")
              prefix = "release/v"
              if not ref_name.startswith(prefix):
                  sys.exit("Push releases must come from a release/v* branch.")
              version = ref_name[len(prefix):]
              tag = f"v{version}"
          else:
              sys.exit(f"Unsupported release event: {event_name}")

          pattern = (
              r"^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)"
              r"(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$"
          )
          if not re.fullmatch(pattern, version):
              sys.exit("Release version is not valid semantic version text.")
          normalized_tag = tag[1:] if tag.lower().startswith("v") else tag
          if normalized_tag != version:
              sys.exit("Release tag version must match the release version.")
          if not tag:
              sys.exit("Release tag must not be empty.")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"version={version}\n")
              output.write(f"tag={tag}\n")
          print(f"Validated release version={version}, tag={tag}")
          PY

  release:
    name: Build and publish tested update
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify sources
        shell: bash
        run: |
          python -m compileall -q core chat llm services security tools voice presentation ui start
          test -f start/bootstrap.py
          test -f core/version.py

      - name: Set the release version in the package
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.test.outputs.version }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import re

          path = Path("core/version.py")
          content = path.read_text(encoding="utf-8")
          version = os.environ["RELEASE_VERSION"].strip()
          updated, count = re.subn(
              r'APP_VERSION\s*=\s*"[^"]+"',
              f'APP_VERSION = "{version}"',
              content,
              count=1,
          )
          if count != 1:
              raise SystemExit("APP_VERSION was not found exactly once")
          path.write_text(updated, encoding="utf-8")
          PY

      - name: Build update archive
        shell: bash
        run: |
          mkdir -p release
          STAGING_DIR="$(mktemp -d)"
          mkdir -p "$STAGING_DIR/jarvis"
          rsync -a \
            --exclude='.git' --exclude='.github' --exclude='.pytest_cache' \
            --exclude='__pycache__' --exclude='tests' --exclude='logs' \
            --exclude='workspace' --exclude='models' --exclude='.venv' \
            --exclude='venv' --exclude='env' --exclude='node_modules' \
            --exclude='user_data' --exclude='coverage.xml' --exclude='*.log' \
            --exclude='*.log.*' --exclude='.env' --exclude='.env.*' \
            --exclude='release' \
            ./ "$STAGING_DIR/jarvis/"

          test -f "$STAGING_DIR/jarvis/start/bootstrap.py"
          test -f "$STAGING_DIR/jarvis/core/version.py"
          test ! -e "$STAGING_DIR/jarvis/.git"
          test ! -e "$STAGING_DIR/jarvis/.venv"
          test ! -e "$STAGING_DIR/jarvis/tests"
          test ! -e "$STAGING_DIR/jarvis/release"

          cd "$STAGING_DIR/jarvis"
          zip -qr "$GITHUB_WORKSPACE/release/jarvis.zip" .

          python - <<'PY'
          import os
          from pathlib import Path
          import zipfile

          archive = Path(os.environ["GITHUB_WORKSPACE"]) / "release" / "jarvis.zip"
          with zipfile.ZipFile(archive) as bundle:
              names = set(bundle.namelist())

          required = {"core/version.py", "start/updater.py", "start/bootstrap.py"}
          missing = sorted(required - names)
          if missing:
              raise SystemExit(f"Update archive is missing required files: {missing}")

          unexpected = sorted(name for name in names if name.startswith("release/"))
          if unexpected:
              raise SystemExit(f"Build output leaked into update archive: {unexpected}")

          print(f"Validated update archive: {len(names)} entries")
          PY

      - name: Align release tag with the tested source commit
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.test.outputs.tag }}
        run: |
          git tag -f "$RELEASE_TAG" "$GITHUB_SHA"
          git push --force origin "refs/tags/$RELEASE_TAG"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.test.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: JARVIS ${{ needs.test.outputs.tag }} - updater release
          body: |
            JARVIS ${{ needs.test.outputs.tag }}.

            - Local Piper TTS uses a shared non-blocking queue for assistant and RoflService speech.
            - Prepared WAV recordings can be matched by response key or normalized text; generated audio uses a bounded exact-match cache.
            - Piper loading failures provide actionable recovery steps and write diagnostic details to `logs\\tts.log`.
            - Settings include scrollable controls and the TTS diagnostics/assets dialog.

            The Windows Python 3.12 syntax check and complete test suite must pass before publication.
            This is a source ZIP for the updater, not a standalone EXE. Piper does not clone voices from arbitrary reference audio.
          files: release/jarvis.zip
          generate_release_notes: false
