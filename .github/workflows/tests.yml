name: JARVIS Architecture Tests

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      create_release:
        description: "Create test release v0.1.1 from satichik-dev"
        required: true
        default: false
        type: boolean

jobs:
  tests:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: config/requirements.txt

      - name: Install project dependencies
        run: python -m pip install -r config/requirements.txt

      - name: Syntax check
        run: python -m compileall -q core chat llm services security tools voice presentation ui start

      - name: Run architecture tests
        run: python -m pytest tests/unit -ra --tb=short

  create-test-release:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.create_release == true }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout satichik-dev
        uses: actions/checkout@v4
        with:
          ref: satichik-dev

      - name: Set release version
        shell: pwsh
        run: |
          $path = "core/version.py"
          $content = Get-Content -Raw -Path $path
          $content = [regex]::Replace(
            $content,
            'APP_VERSION\s*=\s*"[^"]+"',
            'APP_VERSION = "0.1.1"',
            1
          )
          Set-Content -Path $path -Value $content -Encoding utf8

      - name: Create update archive
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP "jarvis-release"
          $root = Join-Path $stage "jarvis"
          $archive = Join-Path $env:RUNNER_TEMP "jarvis.zip"

          if (Test-Path $stage) {
            Remove-Item -Recurse -Force $stage
          }
          New-Item -ItemType Directory -Path $root | Out-Null

          $exclude = @(
            ".git",
            ".github",
            ".pytest_cache",
            "__pycache__",
            "tests",
            "logs",
            "workspace",
            "models"
          )

          Get-ChildItem -Force | Where-Object {
            $exclude -notcontains $_.Name
          } | ForEach-Object {
            Copy-Item -Path $_.FullName -Destination $root -Recurse -Force
          }

          if (-not (Test-Path (Join-Path $root "start/bootstrap.py"))) {
            throw "Release archive does not contain start/bootstrap.py"
          }

          if (-not (Test-Path (Join-Path $root "core/version.py"))) {
            throw "Release archive does not contain core/version.py"
          }

          Compress-Archive -Path (Join-Path $root "*") -DestinationPath $archive -CompressionLevel Optimal

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.1
          name: JARVIS v0.1.1 - update system test
          body: |
            Test release for the JARVIS updater.

            This release is built from satichik-dev with version 0.1.1.
          files: ${{ runner.temp }}/jarvis.zip
          generate_release_notes: false
