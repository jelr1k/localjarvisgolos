name: Tests

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r config/requirements.txt
      - name: Syntax check
        run: python -m compileall -q core chat llm services security tools voice presentation ui start
      - name: Run tests
        run: python -m pytest -q
