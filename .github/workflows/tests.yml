name: JARVIS Architecture Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: config/requirements.txt

      - name: Install project dependencies
        run: python -m pip install -r config/requirements.txt

      - name: Syntax check
        run: python -m compileall -q core chat llm services security tools voice presentation ui start

      - name: Run architecture tests
        run: python -m pytest tests/unit -ra --tb=short
