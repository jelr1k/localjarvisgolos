name: Tests

on:
  push:
  pull_request:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: config/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r config/requirements.txt
      - name: Syntax check
        run: python -m compileall -q core chat llm services security tools voice presentation ui start
      - name: Run tests with coverage
        run: >-
          python -m pytest -q
          --cov=chat --cov=core --cov=llm --cov=services
          --cov=security --cov=tools --cov=voice --cov=presentation
          --cov=start --cov-report=term-missing --cov-report=xml
