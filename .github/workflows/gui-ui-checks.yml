name: GUI UI checks

on:
  push:
    branches: [gui]
  pull_request:
    branches: [gui]

jobs:
  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: electron
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Shared-state tests
        run: npm test
      - name: Build renderer
        run: npm run build
